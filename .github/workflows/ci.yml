name: CI

# 每次推到 main、或有人提 PR 时自动跑
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一个分支连续推，取消上一次没跑完的，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 快，先跑
  analyze-test:
    name: 静态检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  # ---------------------------------------------------------------- 慢，验证真的能编译出 APK
  build-apk:
    name: 编译 release APK
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.3（Flutter 3.24 模板）官方只支持到 Java 20
      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: 上传编译产物（方便直接下下来试）
        uses: actions/upload-artifact@v4
        with:
          name: apk-ci
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
