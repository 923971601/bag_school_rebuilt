name: ✨ 功能建议
description: 想要一个新功能，或者觉得哪里可以做得更好
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！先说清楚「想解决什么问题」，比直接说「加个 xx 按钮」更有用。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 现在的体验哪里让你不舒服？
      placeholder: 例如：请假单上的「目的地」每次都要手打，很麻烦
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望怎么做
      description: 描述你设想的方案；有参考截图更好
    validations:
      required: true

  - type: textarea
    id: alt
    attributes:
      label: 考虑过的其他方案
      description: 你还想过哪些做法，为什么没选它们（可留空）
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 这个改动大概涉及哪块
      options:
        - 校园卡首页（余额卡 / 菜单 / 二维码）
        - 请假列表 / 请假申请表单
        - 请假单详情（字段 / 审批流程 / 头像学籍）
        - 数据存储 / 持久化
        - 构建 / 打包 / CI
        - 文档
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 issue，没有重复
          required: true
        - label: 这个功能是我自己想要的，不是让我来替你实现作业
          required: true
