name: 🐞 Bug 反馈
description: 报告一个可以复现的 bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！**填得越具体，修得越快。**

        > ⚠️ 本项目只维护「从 APK 逆向重建的这份 Flutter 源码」。
        > 如果你是从别处下载的 **原版 APK** 遇到的问题（比如某个菜单点了没反应），
        > 那是原程序的行为，请找原作者 —— 但欢迎你先看一眼
        > [RECONSTRUCTION.md](../blob/main/RECONSTRUCTION.md)，原版的功能实现情况那里写得很清楚。

  - type: textarea
    id: what
    attributes:
      label: 问题是什么
      description: 一句话说清现象
      placeholder: 例如：在详情页改完头像，退出再进来又变回随机头像了
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写，别人照着做能复现才算数
      value: |
        1. 打开 App
        2. 点「...」
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: 期望结果 / 实际结果
      value: |
        **期望**：

        **实际**：
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: 在哪里运行的
      options:
        - Chrome（flutter run -d chrome）
        - Android 模拟器
        - Android 真机
        - flutter test（测试挂了）
        - 其他 / 不确定
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境信息
      description: Flutter 版本、系统版本、手机型号等
      placeholder: "例如：Flutter 3.24.3 / Android 14 / 小米 13 / Windows 11"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 项目版本或提交号
      description: Release 的 tag，或者 git 提交的短哈希
      placeholder: "例如：v1.0.0  或  5e03bc7"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: |
        把 `flutter run` 的报错输出贴上来（**注意先删掉里面的本机路径和密钥**），
        或者直接把截图拖进这个框。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我用的是本仓库的代码，不是从别处下载的原版 APK
          required: true
        - label: 我已经搜索过现有 issue，没有重复
          required: true
        - label: 我贴的日志/截图里没有包含密钥、密码、个人隐私信息
          required: true
